<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Indicador de Pagamentos - Business Blue</title>
    <!-- Biblioteca para ler Excel direto no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            /* Paleta Business Blue exata da imagem */
            --bg-color: #f3f6f9;       /* Off-white / Cinza clarinho */
            --card-bg: #ffffff;        /* Fundo branco para contraste dos cartões */
            --primary: #567c8e;        /* Azul Teal / Médio */
            --primary-dark: #2f4157;   /* Azul Marinho / Escuro */
            --primary-light: #e3ecf2;  /* Azul Gelo / Muito claro */
            --primary-muted: #c7d9e5;  /* Azul Mudo / Acinzentado */
            --primary-accent: #a2c1d1; /* Azul Cinza Claro */
            
            --text-main: #2f4157;      /* Usando o azul mais escuro para texto principal */
            --text-muted: #567c8e;     /* Usando o azul médio para texto secundário */
            --border: #c7d9e5;         /* Bordas com a cor intermediária */
            
            /* Status Badges adaptados para a paleta */
            --status-ok-bg: #e3ecf2;
            --status-ok-text: #2f4157;
            --status-pending-bg: #f3f6f9;
            --status-pending-text: #567c8e;
            --status-pending-border: #a2c1d1;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h2 {
            color: var(--primary-dark);
            font-size: 28px;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
            font-weight: 500;
        }
        
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(47, 65, 87, 0.05), 0 2px 4px -1px rgba(47, 65, 87, 0.03);
            margin-bottom: 25px;
            border: 1px solid var(--primary-light);
        }
        
        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px dashed var(--primary-accent);
            background-color: var(--bg-color);
            padding: 40px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }
        
        .upload-section label {
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        input[type="file"] {
            display: block;
            margin-bottom: 10px;
            font-family: inherit;
        }
        
        input[type="file"]::file-selector-button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-right: 15px;
        }
        
        input[type="file"]::file-selector-button:hover {
            background-color: var(--primary-dark);
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .summary-box {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(47, 65, 87, 0.2);
            border: 1px solid var(--primary-dark);
        }
        
        .summary-box h3 { 
            margin: 0 0 10px 0; 
            font-size: 14px; 
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
        
        .summary-box p { 
            margin: 0; 
            font-size: 32px; 
            font-weight: 700; 
        }
        
        .day-section {
            margin-bottom: 40px;
        }
        
        .day-header {
            background-color: var(--primary-light);
            border-left: 4px solid var(--primary-dark);
            padding: 15px 20px;
            border-radius: 4px 8px 8px 4px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .day-header h4 {
            margin: 0;
            color: var(--primary-dark);
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .day-stats {
            font-size: 14px;
            color: var(--primary-dark);
            font-weight: 500;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background-color: var(--bg-color);
            font-weight: 600;
            color: var(--primary-dark);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        
        th:first-child { border-top-left-radius: 8px; }
        th:last-child { border-top-right-radius: 8px; }
        
        tr:hover td {
            background-color: var(--primary-light);
        }
        
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-ok { 
            background-color: var(--status-ok-bg);
            color: var(--status-ok-text);
        }
        
        .status-pending { 
            background-color: var(--status-pending-bg);
            color: var(--status-pending-text);
            border: 1px solid var(--status-pending-border);
        }
        
        #loader {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            Indicador de Pagamentos Diários
        </h2>
        <p>Visão Executiva - Dados extraídos de arquivo Excel</p>
    </div>

    <div class="card">
        <div class="upload-section">
            <label for="uploadExcel">Carregar Base de Dados (.xlsx)</label>
            <input type="file" id="uploadExcel" accept=".xlsx, .xls">
            <small style="color: var(--text-muted); margin-top: 10px;">
                Colunas esperadas na primeira linha: <strong>Data, Tipo, Valor, Status</strong>
            </small>
        </div>
    </div>

    <div id="loader">Processando dados...</div>

    <div id="dashboard" style="display: none;">
        <div class="summary-grid">
            <div class="summary-box">
                <h3>Total de Pagamentos</h3>
                <p id="totalQtd">0</p>
            </div>
            <div class="summary-box">
                <h3>Volume Financeiro Total</h3>
                <p id="totalValor">R$ 0,00</p>
            </div>
        </div>

        <div class="card" id="dadosPorDia">
            <!-- Os dados agrupados por dia aparecerão aqui -->
        </div>
    </div>
</div>

<script>
    document.getElementById('uploadExcel').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Mostra o "carregando"
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loader').style.display = 'block';

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                const json = XLSX.utils.sheet_to_json(worksheet, {raw: false});
                
                setTimeout(() => { 
                    processarDados(json);
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                }, 500);

            } catch (error) {
                alert("Erro ao ler o arquivo. Certifique-se de que é um Excel válido.");
                document.getElementById('loader').style.display = 'none';
            }
        };
        reader.readAsArrayBuffer(file);
    });

    function limparValor(val) {
        if (typeof val === 'number') return val;
        if (!val) return 0;
        let limpo = val.toString().replace(/[R$\s\.]/g, '').replace(',', '.');
        return parseFloat(limpo) || 0;
    }

    function formatarMoeda(valor) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
    }

    function processarDados(dados) {
        const agrupadoPorData = {};
        let totalQtd = 0;
        let totalValor = 0;

        dados.forEach(linha => {
            let data = linha['Data'] || linha['data'] || linha['DATA'] || 'Sem Data';
            const tipo = linha['Tipo'] || linha['tipo'] || linha['TIPO'] || '-';
            
            let valorBruto = linha['Valor'] || linha['valor'] || linha['VALOR'];
            const valor = limparValor(valorBruto);
            
            const statusBruto = linha['Status'] || linha['status'] || linha['STATUS'] || '';
            const status = statusBruto.trim();

            if (!agrupadoPorData[data]) {
                agrupadoPorData[data] = { qtd: 0, soma: 0, itens: [] };
            }

            agrupadoPorData[data].qtd += 1;
            agrupadoPorData[data].soma += valor;
            agrupadoPorData[data].itens.push({ tipo, valor, status });

            totalQtd++;
            totalValor += valor;
        });

        document.getElementById('totalQtd').innerText = totalQtd;
        document.getElementById('totalValor').innerText = formatarMoeda(totalValor);
        
        renderizarTabelas(agrupadoPorData);
    }

    function renderizarTabelas(dadosAgrupados) {
        const container = document.getElementById('dadosPorDia');
        container.innerHTML = '<h3 style="color: var(--primary-dark); margin-top: 0; margin-bottom: 20px;">Detalhamento por Data</h3>';

        for (const [data, info] of Object.entries(dadosAgrupados)) {
            let html = `
                <div class="day-section">
                    <div class="day-header">
                        <h4>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            ${data}
                        </h4>
                        <div class="day-stats">
                            <span>Vol: <strong>${info.qtd}</strong> op.</span>
                            <span style="margin: 0 10px; color: var(--border);">|</span>
                            <span>Total: <strong>${formatarMoeda(info.soma)}</strong></span>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Tipo de Operação</th>
                                <th>Valor (R$)</th>
                                <th>Status da Esteira</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            info.itens.forEach(item => {
                let statusBadge = '';
                let statusLower = item.status.toLowerCase();
                
                // Adaptação dos checks para a paleta Business Blue
                if (statusLower === 'envio de comprovante') {
                    statusBadge = `
                        <span class="badge status-ok">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            OK - Comprovante
                        </span>`;
                } else {
                    statusBadge = `
                        <span class="badge status-pending">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            ${item.status}
                        </span>`;
                }

                html += `
                    <tr>
                        <td style="font-weight: 500;">${item.tipo}</td>
                        <td>${formatarMoeda(item.valor)}</td>
                        <td>${statusBadge}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            container.innerHTML += html;
        }
    }
</script>

</body>
</html>
